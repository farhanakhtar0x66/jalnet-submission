name: Android preview feedback
description: Report a reproducible problem with the standalone JalNet Preview.
title: "[Android preview] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public report. Do not include personal photos, precise locations,
        notifications, account details, credentials, private drafts, raw device logs
        or signing material. Screenshots are optional and must be redacted.
        This form does not collect automatic diagnostics or analytics.
        Follow the testing instructions attached to the verified prerelease.
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: "Model: …; Android: …"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: JalNet Preview version or build
      description: Use the version shown in About or the verified release you installed.
      placeholder: "0.1.0-preview.1 (versionCode 2)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the screen, inputs and appearance; mention internet availability if relevant.
      placeholder: |
        1. Open …
        2. Enter …
        3. Tap …
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      placeholder: |
        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Redacted screenshot (optional)
      description: Attach only if it helps. Hide photos, notifications, private text and precise location.
    validations:
      required: false
